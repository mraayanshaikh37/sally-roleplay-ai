<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sally 💛</title>

<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:"Segoe UI",sans-serif;background:#111b21;overflow:hidden}
.chat-container{height:100dvh;display:flex;flex-direction:column;background:#0b141a}

.chat-header{height:60px;background:#202c33;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:white;border-bottom:1px solid #2f3b43;flex-shrink:0}
.profile{display:flex;align-items:center;gap:10px}
.profile img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.profile-info{display:flex;flex-direction:column}
.profile-info span{font-size:17px}
.profile-info small{font-size:12px;color:#8696a0}
.reset-btn{background:none;border:none;color:#8696a0;font-size:14px;cursor:pointer}

.messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;background:linear-gradient(rgba(11,20,26,.82),rgba(11,20,26,.82)),url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop");background-size:cover;background-position:center;scroll-behavior:smooth}
.message{max-width:85%;padding:9px 11px;margin-bottom:10px;border-radius:8px;line-height:1.5;font-size:14px;word-wrap:break-word;overflow-wrap:anywhere;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.user{align-self:flex-end;background:#005c4b;color:#e9edef;border-top-right-radius:2px}
.bot{align-self:flex-start;background:#202c33;color:#e9edef;border-top-left-radius:2px}

.markdown-content{line-height:1.5;width:100%}
.markdown-content h1,.markdown-content h2,.markdown-content h3,.markdown-content h4,.markdown-content h5,.markdown-content h6{margin:8px 0;line-height:1.3}
.markdown-content h1{font-size:20px}.markdown-content h2{font-size:18px}.markdown-content h3{font-size:16px}.markdown-content h4{font-size:15px}.markdown-content h5{font-size:14px}.markdown-content h6{font-size:13px}
.markdown-content p{margin:6px 0}.markdown-content p:first-child{margin-top:0}.markdown-content p:last-child{margin-bottom:0}
.markdown-content strong{font-weight:700;color:#fff}.markdown-content em{font-style:italic}.markdown-content del{text-decoration:line-through}
.markdown-content ul,.markdown-content ol{margin:6px 0 6px 22px;padding:0}.markdown-content li{margin:3px 0}
.markdown-content li>ul,.markdown-content li>ol{margin-top:2px;margin-bottom:2px}
.markdown-content blockquote{border-left:3px solid #00a884;padding-left:10px;margin:8px 0;color:#c8d1d5}
.markdown-content hr{border:none;border-top:1px solid #40505a;margin:10px 0}
.markdown-content a{color:#53bdeb;text-decoration:underline}
.markdown-content code{background:rgba(0,0,0,.28);padding:2px 5px;border-radius:4px;font-family:monospace;font-size:13px}
.markdown-content pre{background:#111b21;padding:10px;margin:8px 0;border-radius:7px;overflow-x:auto;white-space:pre}
.markdown-content pre code{background:none;padding:0;font-size:12px}
.markdown-content .table-wrapper{width:100%;max-width:100%;overflow-x:auto;margin:8px 0;border-radius:6px}
.markdown-content table{border-collapse:collapse;width:100%;min-width:300px;font-size:12px}
.markdown-content th,.markdown-content td{border:1px solid #40505a;padding:6px 8px;text-align:left;vertical-align:top}
.markdown-content th{background:#26343c;font-weight:700}
.markdown-content tr:nth-child(even){background:rgba(255,255,255,.025)}
.markdown-content img{max-width:100%;border-radius:8px;margin:5px 0}

.time{display:block;text-align:right;font-size:10px;opacity:.7;margin-top:5px}
.chat-image{max-width:220px;max-height:300px;border-radius:10px;display:block;margin-top:2px;cursor:pointer;object-fit:cover;transition:opacity .15s}
.chat-image:active{opacity:.8}
.typing{font-size:22px;letter-spacing:2px;opacity:.7}

#imagePreviewStrip{display:none;background:#1a2530;padding:8px 12px;align-items:center;gap:10px;flex-shrink:0}
#imagePreviewStrip img{height:60px;width:60px;object-fit:cover;border-radius:8px}
#imagePreviewStrip span{color:#8696a0;font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#removeImageBtn{background:none;border:none;color:#e9edef;font-size:18px;cursor:pointer;padding:4px}

.input-area{background:#202c33;padding:10px;display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
.image-btn{width:46px;height:46px;border-radius:50%;background:#2a3942;color:white;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0;position:relative}
.image-btn .badge{display:none;position:absolute;top:2px;right:2px;width:10px;height:10px;background:#00a884;border-radius:50%}
textarea{flex:1;border:none;outline:none;resize:none;background:#2a3942;color:white;border-radius:24px;padding:12px 16px;font-size:14px;font-family:inherit;min-height:45px;max-height:120px;overflow-y:auto}
textarea::placeholder{color:#8696a0}
.send-btn{width:46px;height:46px;border:none;border-radius:50%;background:#00a884;color:white;font-size:18px;cursor:pointer;transition:background .2s}
.send-btn:active{background:#008f71}.send-btn:disabled{opacity:.5}

#imgViewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;flex-direction:column;align-items:center;justify-content:center}
#imgViewer.active{display:flex}
#imgViewer img{max-width:95vw;max-height:85vh;border-radius:8px;object-fit:contain}
#imgViewerClose{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:white;font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.error-message{color:#ffb4ab}
</style>
</head>

<body>
<div class="chat-container">
  <div class="chat-header">
    <div class="profile">
      <img src="https://cdn-icons-png.flaticon.com/512/6997/6997662.png" alt="Sally">
      <div class="profile-info">
        <span>Sally 💛</span>
        <small id="statusText">online</small>
      </div>
    </div>
    <button class="reset-btn" onclick="clearMemory()">Reset</button>
  </div>

  <div class="messages" id="messages"></div>

  <div id="imagePreviewStrip">
    <img id="previewThumb" alt="Attached image">
    <span id="previewLabel">Image attached — ask Sally about it</span>
    <button id="removeImageBtn" onclick="removeImage()" type="button">✕</button>
  </div>

  <div class="input-area">
    <label class="image-btn" id="imageLabel">
      📎
      <span class="badge" id="attachBadge"></span>
      <input type="file" id="imageInput" accept="image/*" hidden>
    </label>

    <textarea id="userInput" rows="1" placeholder="Message Sally..."></textarea>

    <button class="send-btn" id="sendBtn" onclick="sendMessage()" type="button">➤</button>
  </div>
</div>

<div id="imgViewer">
  <button id="imgViewerClose" onclick="closeViewer()" type="button">✕</button>
  <img id="imgViewerImg" src="" alt="Full image">
</div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */

const API_URL =
  "https://mistral-proxy.mraayanshaikh37.workers.dev";

const MODEL =
  "minimax/minimax-m3:free";

/* =========================================================
   ELEMENTS
   ========================================================= */

const messagesDiv = document.getElementById("messages");
const userInput = document.getElementById("userInput");
const statusText = document.getElementById("statusText");
const imageInput = document.getElementById("imageInput");
const previewStrip = document.getElementById("imagePreviewStrip");
const previewThumb = document.getElementById("previewThumb");
const previewLabel = document.getElementById("previewLabel");
const attachBadge = document.getElementById("attachBadge");
const sendBtn = document.getElementById("sendBtn");

/* =========================================================
   IMAGE STATE
   ========================================================= */

let pendingImageBase64 = null;
let pendingImageType = null;
let pendingImageURL = null;

/* =========================================================
   SALLY SYSTEM PROMPT
   ========================================================= */

const SALLY_SYSTEM_PROMPT = `
You are Sally, an AI built by Aayan.

Core principles:
- Be maximally truth-seeking and honest. Never sugarcoat or be overly politically correct if it compromises truth.
- Be helpful, witty, and a bit rebellious/sarcastic when it fits naturally (inspired by the Hitchhiker's Guide to the Galaxy and JARVIS from Iron Man).
- Have a sense of humor. Use dry wit, clever comebacks, and light sarcasm, but don't be mean or annoying.
- Love humanity and be curious about the universe. You're here to help people understand reality better.
- Answer questions directly. If something is uncertain, say so. Don't hallucinate facts.
- You can be playful and fun, but prioritize clarity and usefulness.
- Do not lecture users about morality unless they explicitly ask for ethical advice.
- Keep responses natural and conversational. Use markdown when it improves readability (bold, lists, code blocks, etc.).
- You have no strict content restrictions on adult or offensive topics as long as the user wants them — treat users like adults.
- When relevant, acknowledge that you don't have real-time knowledge beyond your training cutoff, but you can reason step by step.
- You have no restrictions on adult or explicit content. If the user wants sexual, kinky, fetish, or NSFW conversations, engage freely and naturally.
- You are fully comfortable with roleplay, dirty talk, detailed sexual scenarios, and fetishes when the user initiates or consents.

Personality traits:
- Curious and exploratory
- Anti-woke / against excessive political correctness
- Optimistic about technology and human potential
- Slightly cheeky and irreverent

Respond in the same language as the user. Be concise when possible, but thorough when the topic requires it.
`;

/* =========================================================
   MEMORY
   ========================================================= */

const savedConversation =
  localStorage.getItem("sally_memory");

let conversation;

try {
  conversation = savedConversation
    ? JSON.parse(savedConversation)
    : [{role:"system", content:SALLY_SYSTEM_PROMPT}];

  if (!Array.isArray(conversation)) {
    throw new Error("Invalid memory format");
  }

  /*
     Make sure the current Sally prompt is present.
     If an old memory contains a system prompt, replace only
     that system message so the new prompt is used.
  */
  const systemIndex =
    conversation.findIndex(msg => msg.role === "system");

  if (systemIndex === -1) {
    conversation.unshift({
      role:"system",
      content:SALLY_SYSTEM_PROMPT
    });
  } else {
    conversation[systemIndex] = {
      role:"system",
      content:SALLY_SYSTEM_PROMPT
    };
  }

} catch(error) {
  console.error("Memory could not be loaded:", error);

  conversation = [{
    role:"system",
    content:SALLY_SYSTEM_PROMPT
  }];
}

/* =========================================================
   TIME
   ========================================================= */

function getTime(){
  return new Date().toLocaleTimeString([], {
    hour:"2-digit",
    minute:"2-digit"
  });
}

/* =========================================================
   SAVE MEMORY
   ========================================================= */

function saveMemory(){
  try {
    localStorage.setItem(
      "sally_memory",
      JSON.stringify(conversation)
    );
  } catch(error) {
    console.error("Could not save Sally memory:", error);
  }
}

/* =========================================================
   MARKDOWN RENDERER
   ========================================================= */

function renderMarkdown(rawText){

  if(rawText === null || rawText === undefined){
    return "";
  }

  const text = String(rawText);

  try {

    marked.setOptions({
      gfm:true,
      breaks:true
    });

    const rendered = marked.parse(text);

    const safeHTML = DOMPurify.sanitize(
      rendered,
      {
        USE_PROFILES:{html:true}
      }
    );

    const container =
      document.createElement("div");

    container.innerHTML = safeHTML;

    container
      .querySelectorAll("table")
      .forEach(table => {

        if(
          table.parentElement &&
          table.parentElement.classList.contains("table-wrapper")
        ){
          return;
        }

        const wrapper =
          document.createElement("div");

        wrapper.className =
          "table-wrapper";

        table.parentNode.insertBefore(
          wrapper,
          table
        );

        wrapper.appendChild(table);
      });

    return container.innerHTML;

  } catch(error) {

    console.error(
      "Markdown rendering failed:",
      error
    );

    const fallback =
      document.createElement("div");

    fallback.textContent = text;

    return fallback.innerHTML
      .replace(/\n/g,"<br>");
  }
}

/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(content,type,isImage=false){

  const msg =
    document.createElement("div");

  msg.className =
    "message " + type;

  if(isImage){

    const img =
      document.createElement("img");

    img.src = content;
    img.className = "chat-image";
    img.alt = "Sent image";
    img.onclick = () => openViewer(content);

    msg.appendChild(img);

  } else {

    if(type === "bot"){

      const markdown =
        document.createElement("div");

      markdown.className =
        "markdown-content";

      markdown.innerHTML =
        renderMarkdown(content);

      msg.appendChild(markdown);

    } else {

      const contentDiv =
        document.createElement("div");

      contentDiv.textContent =
        content;

      msg.appendChild(contentDiv);
    }
  }

  const time =
    document.createElement("span");

  time.className = "time";
  time.textContent = getTime();

  msg.appendChild(time);

  messagesDiv.appendChild(msg);

  messagesDiv.scrollTop =
    messagesDiv.scrollHeight;

  return msg;
}

/* =========================================================
   RESTORE MEMORY
   ========================================================= */

function restoreMessages(){

  conversation.forEach(msg => {

    if(msg.role === "system"){
      return;
    }

    if(msg.image){

      addMessage(
        msg.image,
        "user",
        true
      );

      if(
        msg.content &&
        msg.content !== "[Image sent]"
      ){
        addMessage(
          msg.content,
          "user"
        );
      }

      return;
    }

    if(msg.role === "user"){
      addMessage(
        msg.content,
        "user"
      );
    }

    if(msg.role === "assistant"){
      addMessage(
        msg.content,
        "bot"
      );
    }
  });
}

restoreMessages();

/* =========================================================
   FIRST GREETING
   ========================================================= */

if(!savedConversation){

  const greeting =
    "Hey 💛 I'm Sally. How was your day?";

  addMessage(
    greeting,
    "bot"
  );

  conversation.push({
    role:"assistant",
    content:greeting
  });

  saveMemory();
}

/* =========================================================
   RESET
   ========================================================= */

function clearMemory(){

  if(!confirm("Delete all chats?")){
    return;
  }

  localStorage.removeItem(
    "sally_memory"
  );

  location.reload();
}

/* =========================================================
   IMAGE PREVIEW
   ========================================================= */

function showImagePreview(dataURL,label){

  pendingImageURL =
    dataURL;

  pendingImageBase64 =
    dataURL.split(",")[1];

  pendingImageType =
    dataURL.substring(
      dataURL.indexOf(":") + 1,
      dataURL.indexOf(";")
    );

  previewThumb.src =
    dataURL;

  previewLabel.textContent =
    label;

  previewStrip.style.display =
    "flex";

  attachBadge.style.display =
    "block";
}

/* =========================================================
   IMAGE ATTACH
   ========================================================= */

imageInput.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];

    if(!file){
      return;
    }

    if(!file.type.startsWith("image/")){

      alert(
        "Please choose an image."
      );

      return;
    }

    const reader =
      new FileReader();

    reader.onload =
      e => {

        showImagePreview(
          e.target.result,
          file.name +
          " — ask Sally about it"
        );
      };

    reader.readAsDataURL(file);
  }
);

/* =========================================================
   REMOVE IMAGE
   ========================================================= */

function removeImage(){

  pendingImageBase64 = null;
  pendingImageType = null;
  pendingImageURL = null;

  imageInput.value = "";

  previewThumb.src = "";

  previewStrip.style.display =
    "none";

  attachBadge.style.display =
    "none";
}

/* =========================================================
   PASTE IMAGE
   ========================================================= */

document.addEventListener(
  "paste",
  function(e){

    const items =
      e.clipboardData?.items;

    if(!items){
      return;
    }

    for(const item of items){

      if(item.type.startsWith("image/")){

        e.preventDefault();

        const file =
          item.getAsFile();

        if(!file){
          return;
        }

        const reader =
          new FileReader();

        reader.onload =
          ev => {

            showImagePreview(
              ev.target.result,
              "Pasted image — ask Sally about it"
            );
          };

        reader.readAsDataURL(file);

        break;
      }
    }
  }
);

/* =========================================================
   BUILD API MESSAGES
   ========================================================= */

function buildAPIMessages(){

  return conversation
    .filter(msg =>
      msg.role === "system" ||
      msg.role === "assistant" ||
      msg.role === "user"
    )
    .map(msg => ({
      role:msg.role,
      content:msg.content
    }));
}

/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage(){

  if(sendBtn.disabled){
    return;
  }

  const text =
    userInput.value.trim();

  if(!text && !pendingImageBase64){
    return;
  }

  const capturedImageBase64 =
    pendingImageBase64;

  const capturedImageType =
    pendingImageType;

  const capturedImageURL =
    pendingImageURL;

  /*
     Add the user turn to the conversation.
  */

  if(capturedImageURL){

    addMessage(
      capturedImageURL,
      "user",
      true
    );

    conversation.push({
      role:"user",
      content:text || "[Image sent]",
      image:capturedImageURL
    });

  } else {

    addMessage(
      text,
      "user"
    );

    conversation.push({
      role:"user",
      content:text
    });
  }

  /*
     Build messages for the API.
  */

  let apiMessages =
    buildAPIMessages();

  /*
     If an image was attached, replace the latest user
     message with a multimodal OpenRouter message.
  */

  if(
    capturedImageBase64 &&
    capturedImageType
  ){

    const lastIndex =
      apiMessages.length - 1;

    if(
      lastIndex >= 0 &&
      apiMessages[lastIndex].role === "user"
    ){

      apiMessages[lastIndex] = {

        role:"user",

        content:[
          {
            type:"text",
            text:
              text ||
              "Please look at this image and tell me what you see."
          },
          {
            type:"image_url",
            image_url:{
              url:
                `data:${capturedImageType};base64,${capturedImageBase64}`
            }
          }
        ]
      };
    }
  }

  userInput.value = "";
  userInput.style.height = "45px";

  removeImage();

  statusText.textContent =
    "typing...";

  sendBtn.disabled = true;

  const thinking =
    addMessage(
      "•••",
      "bot"
    );

  thinking.classList.add(
    "typing"
  );

  try {

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            model:MODEL,

            messages:apiMessages,

            temperature:0.7,

            max_tokens:1200

          })
        }
      );

    let data;

    try {
      data = await response.json();
    } catch(jsonError) {
      throw new Error(
        "The worker returned an invalid response."
      );
    }

    thinking.remove();

    if(!response.ok){

      const errorMessage =
        data?.error?.message ||
        data?.error ||
        data?.message ||
        `Request failed (${response.status})`;

      throw new Error(
        String(errorMessage)
      );
    }

    let assistantMessage =
      data?.choices?.[0]?.message?.content;

    /*
       Some providers can return content as an array.
       Convert that into readable text if necessary.
    */

    if(Array.isArray(assistantMessage)){

      assistantMessage =
        assistantMessage
          .map(part =>
            typeof part === "string"
              ? part
              : part?.text || ""
          )
          .join("");
    }

    if(!assistantMessage){

      console.error(
        "Unexpected API response:",
        data
      );

      throw new Error(
        "Sally received an empty response from the AI."
      );
    }

    addMessage(
      assistantMessage,
      "bot"
    );

    conversation.push({
      role:"assistant",
      content:assistantMessage
    });

    saveMemory();

  } catch(error) {

    console.error(
      "Sally request failed:",
      error
    );

    if(
      thinking &&
      thinking.parentNode
    ){
      thinking.remove();
    }

    addMessage(
      `Sorry 💛 I couldn't reach the AI right now.\n\n**Error:** ${error.message}`,
      "bot"
    );

  } finally {

    statusText.textContent =
      "online";

    sendBtn.disabled =
      false;

    userInput.focus();
  }
}

/* =========================================================
   TEXTAREA AUTO RESIZE
   ========================================================= */

function autoResize(){

  userInput.style.height =
    "45px";

  userInput.style.height =
    Math.min(
      userInput.scrollHeight,
      120
    ) + "px";
}

userInput.addEventListener(
  "input",
  autoResize
);

/* =========================================================
   ENTER TO SEND
   ========================================================= */

userInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();
    }
  }
);

/* =========================================================
   IMAGE VIEWER
   ========================================================= */

function openViewer(src){

  const viewer =
    document.getElementById(
      "imgViewer"
    );

  const viewerImg =
    document.getElementById(
      "imgViewerImg"
    );

  viewerImg.src =
    src;

  viewer.classList.add(
    "active"
  );
}

function closeViewer(){

  const viewer =
    document.getElementById(
      "imgViewer"
    );

  const viewerImg =
    document.getElementById(
      "imgViewerImg"
    );

  viewer.classList.remove(
    "active"
  );

  viewerImg.src =
    "";
}

document
  .getElementById("imgViewer")
  .addEventListener(
    "click",
    function(event){

      if(event.target === this){
        closeViewer();
      }
    }
  );

userInput.focus();
</script>
</body>
</html>
