<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sally 💛</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
height:100%;
font-family:"Segoe UI",sans-serif;
background:#111b21;
overflow:hidden;
}

/* APP */

.chat-container{
height:100dvh;
display:flex;
flex-direction:column;
background:#0b141a;
}

/* HEADER */

.chat-header{
height:60px;
background:#202c33;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
color:white;
border-bottom:1px solid #2f3b43;
flex-shrink:0;
}

.profile{
display:flex;
align-items:center;
gap:10px;
}

.profile img{
width:42px;
height:42px;
border-radius:50%;
object-fit:cover;
}

.profile-info{
display:flex;
flex-direction:column;
}

.profile-info span{
font-size:17px;
}

.profile-info small{
font-size:12px;
color:#8696a0;
}

.reset-btn{
background:none;
border:none;
color:#8696a0;
font-size:14px;
cursor:pointer;
}

/* CHAT AREA */

.messages{
flex:1;
overflow-y:auto;
padding:12px;

display:flex;
flex-direction:column;

background:
linear-gradient(
rgba(11,20,26,0.82),
rgba(11,20,26,0.82)
),

url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

scroll-behavior:smooth;
}

/* MESSAGE */

.message{
max-width:78%;
padding:8px 10px;
margin-bottom:10px;
border-radius:8px;
line-height:1.4;
font-size:14px;
word-wrap:break-word;
white-space:pre-wrap;
animation:fadeIn .15s ease;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(5px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.user{
align-self:flex-end;
background:#005c4b;
color:#e9edef;
border-top-right-radius:2px;
}

.bot{
align-self:flex-start;
background:#202c33;
color:#e9edef;
border-top-left-radius:2px;
}

.time{
display:block;
text-align:right;
font-size:10px;
opacity:0.7;
margin-top:4px;
}

/* IMAGE */

.chat-image{
max-width:220px;
border-radius:10px;
display:block;
margin-top:5px;
}

/* TYPING */

.typing{
font-size:22px;
letter-spacing:2px;
opacity:0.7;
}

/* INPUT */

.input-area{
background:#202c33;
padding:10px;
display:flex;
align-items:flex-end;
gap:8px;
flex-shrink:0;
}

.image-btn{
width:46px;
height:46px;

border-radius:50%;

background:#2a3942;
color:white;

display:flex;
align-items:center;
justify-content:center;

font-size:18px;
cursor:pointer;

flex-shrink:0;
}

textarea{
flex:1;
border:none;
outline:none;
resize:none;

background:#2a3942;
color:white;

border-radius:24px;

padding:12px 16px;

font-size:14px;
font-family:inherit;

min-height:45px;
max-height:120px;

overflow-y:auto;
}

.send-btn{
width:46px;
height:46px;

border:none;
border-radius:50%;

background:#00a884;
color:white;

font-size:18px;

cursor:pointer;
}

</style>
</head>

<body>

<div class="chat-container">

<!-- HEADER -->

<div class="chat-header">

<div class="profile">

<img src="https://cdn-icons-png.flaticon.com/512/6997/6997662.png">

<div class="profile-info">
<span>Sally 💛</span>
<small id="statusText">online</small>
</div>

</div>

<button
class="reset-btn"
onclick="clearMemory()"
>
Reset
</button>

</div>

<!-- CHAT -->

<div
class="messages"
id="messages"
></div>

<!-- INPUT -->

<div class="input-area">

<label class="image-btn">
📎

<input
type="file"
id="imageInput"
accept="image/*"
hidden
>

</label>

<textarea
id="userInput"
rows="1"
placeholder="Message Sally..."
></textarea>

<button
class="send-btn"
onclick="sendMessage()"
>
➤
</button>

</div>

</div>

<script>

/* =========================
   CONFIG
========================= */

const API_URL =
"https://api.mistral.ai/v1/chat/completions";

const API_KEY =
"ByfTiHvJLkqBMfuWTAQJO5ExvIYuKqE6";

/* =========================
   ELEMENTS
========================= */

const messagesDiv =
document.getElementById("messages");

const userInput =
document.getElementById("userInput");

const statusText =
document.getElementById("statusText");

const imageInput =
document.getElementById("imageInput");

/* =========================
   MEMORY
========================= */

const defaultConversation = [

{
role:"system",

content:`
You are Sally.

You are emotionally warm,
calm,
natural,
and realistic.

Avoid robotic replies.
Avoid explicit sexual content.
Keep responses concise.
Be emotionally intelligent.
`
}

];

const savedConversation =
localStorage.getItem("sally_memory");

const conversation =
savedConversation
? JSON.parse(savedConversation)
: defaultConversation;

/* =========================
   TIME
========================= */

function getTime(){

const now = new Date();

return now.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});

}

/* =========================
   ADD MESSAGE
========================= */

function addMessage(
content,
type,
isImage=false
){

const msg =
document.createElement("div");

msg.className =
"message " + type;

if(isImage){

msg.innerHTML =
`
<img
src="${content}"
class="chat-image"
>

<span class="time">
${getTime()}
</span>
`;

}

else{

msg.innerHTML =
`
${content}

<span class="time">
${getTime()}
</span>
`;

}

messagesDiv.appendChild(msg);

messagesDiv.scrollTop =
messagesDiv.scrollHeight;

}

/* =========================
   RESTORE MEMORY
========================= */

function restoreMessages(){

conversation.forEach(msg => {

if(msg.image){

addMessage(
msg.image,
"user",
true
);

return;

}

if(msg.role === "user"){

addMessage(
msg.content,
"user"
);

}

if(msg.role === "assistant"){

addMessage(
msg.content,
"bot"
);

}

});

}

restoreMessages();

/* =========================
   FIRST GREETING
========================= */

if(!savedConversation){

const greeting =
"Hey 💛 I’m Sally. How was your day?";

addMessage(
greeting,
"bot"
);

conversation.push({
role:"assistant",
content:greeting
});

saveMemory();

}

/* =========================
   SAVE MEMORY
========================= */

function saveMemory(){

localStorage.setItem(
"sally_memory",
JSON.stringify(conversation)
);

}

/* =========================
   RESET
========================= */

function clearMemory(){

const confirmReset =
confirm(
"Delete all chats?"
);

if(!confirmReset) return;

localStorage.removeItem(
"sally_memory"
);

location.reload();

}

/* =========================
   IMAGE SUPPORT
========================= */

imageInput.addEventListener(

"change",

function(){

const file =
this.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload =
function(e){

const imageData =
e.target.result;

/* SHOW IMAGE */

addMessage(
imageData,
"user",
true
);

/* SAVE MEMORY */

conversation.push({

role:"user",
content:"[Image]",
image:imageData

});

saveMemory();

/* OPTIONAL AUTO REPLY */

setTimeout(() => {

const reply =
"That image looks interesting 💛";

addMessage(
reply,
"bot"
);

conversation.push({

role:"assistant",
content:reply

});

saveMemory();

},1000);

};

reader.readAsDataURL(file);

}
);

/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

const text =
userInput.value.trim();

if(!text) return;

/* SHOW USER MESSAGE */

addMessage(
text,
"user"
);

conversation.push({

role:"user",
content:text

});

saveMemory();

userInput.value = "";

userInput.style.height =
"45px";

/* TYPING */

statusText.textContent =
"typing...";

const thinking =
document.createElement("div");

thinking.className =
"message bot typing";

thinking.innerHTML =
"•••";

messagesDiv.appendChild(
thinking
);

messagesDiv.scrollTop =
messagesDiv.scrollHeight;

try{

/* LIMIT MEMORY */

if(conversation.length > 40){

conversation.splice(1,2);

}

const response =
await fetch(API_URL,{

method:"POST",

headers:{

"Authorization":
"Bearer " + API_KEY,

"Content-Type":
"application/json"

},

body:JSON.stringify({

model:
"mistral-large-latest",

messages:
conversation

})

});

const data =
await response.json();

thinking.remove();

statusText.textContent =
"online";

const reply =
data.choices?.[0]?.message?.content
||
"Something interrupted my thoughts...";

addMessage(
reply,
"bot"
);

conversation.push({

role:"assistant",
content:reply

});

saveMemory();

}

catch(error){

thinking.remove();

statusText.textContent =
"online";

addMessage(
"Connection issue or invalid API key.",
"bot"
);

console.error(error);

}

}

/* =========================
   ENTER TO SEND
========================= */

userInput.addEventListener(

"keydown",

function(e){

if(
e.key === "Enter"
&&
!e.shiftKey
){

e.preventDefault();

sendMessage();

}

}
);

/* =========================
   AUTO RESIZE
========================= */

userInput.addEventListener(

"input",

function(){

this.style.height =
"auto";

this.style.height =
this.scrollHeight + "px";

}

);

</script>

</body>
  </html>
