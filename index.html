<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sally 💛</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; }

html,body{
  height:100%;
  font-family:"Segoe UI",sans-serif;
  background:#111b21;
  overflow:hidden;
}

.chat-container{
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#0b141a;
}

/* HEADER */
.chat-header{
  height:60px;
  background:#202c33;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  color:white;
  border-bottom:1px solid #2f3b43;
  flex-shrink:0;
}

.profile{ display:flex; align-items:center; gap:10px; }

.profile img{
  width:42px; height:42px;
  border-radius:50%;
  object-fit:cover;
}

.profile-info{ display:flex; flex-direction:column; }
.profile-info span{ font-size:17px; }
.profile-info small{ font-size:12px; color:#8696a0; }

.reset-btn{
  background:none; border:none;
  color:#8696a0; font-size:14px; cursor:pointer;
}

/* MESSAGES */
.messages{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(rgba(11,20,26,0.82),rgba(11,20,26,0.82)),
    url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop");
  background-size:cover;
  background-position:center;
  scroll-behavior:smooth;
}

.message{
  max-width:78%;
  padding:8px 10px;
  margin-bottom:10px;
  border-radius:8px;
  line-height:1.4;
  font-size:14px;
  word-wrap:break-word;
  white-space:pre-wrap;
  animation:fadeIn .15s ease;
}

@keyframes fadeIn{
  from{ opacity:0; transform:translateY(5px); }
  to{ opacity:1; transform:translateY(0); }
}

.user{
  align-self:flex-end;
  background:#005c4b;
  color:#e9edef;
  border-top-right-radius:2px;
}

.bot{
  align-self:flex-start;
  background:#202c33;
  color:#e9edef;
  border-top-left-radius:2px;
}

.time{
  display:block;
  text-align:right;
  font-size:10px;
  opacity:0.7;
  margin-top:4px;
}

.chat-image{
  max-width:220px;
  border-radius:10px;
  display:block;
  margin-top:5px;
  cursor:pointer;
  transition:opacity 0.15s;
}

.chat-image:active{ opacity:0.8; }

/* FULLSCREEN IMAGE VIEWER */
#imgViewer{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  z-index:999;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

#imgViewer.active{ display:flex; }

#imgViewer img{
  max-width:95vw;
  max-height:85vh;
  border-radius:8px;
  object-fit:contain;
}

#imgViewerClose{
  position:absolute;
  top:16px;
  right:16px;
  background:rgba(255,255,255,0.15);
  border:none;
  color:white;
  font-size:22px;
  width:40px;
  height:40px;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.typing{ font-size:22px; letter-spacing:2px; opacity:0.7; }

/* IMAGE PREVIEW STRIP */
#imagePreviewStrip{
  display:none;
  background:#1a2530;
  padding:8px 12px;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}

#imagePreviewStrip img{
  height:60px;
  border-radius:8px;
}

#imagePreviewStrip span{
  color:#8696a0;
  font-size:12px;
  flex:1;
}

#removeImageBtn{
  background:none;
  border:none;
  color:#e9edef;
  font-size:18px;
  cursor:pointer;
  padding:4px;
}

/* INPUT */
.input-area{
  background:#202c33;
  padding:10px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  flex-shrink:0;
}

.image-btn{
  width:46px; height:46px;
  border-radius:50%;
  background:#2a3942;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  cursor:pointer;
  flex-shrink:0;
  position:relative;
}

/* Badge shown when image is attached */
.image-btn .badge{
  display:none;
  position:absolute;
  top:2px; right:2px;
  width:10px; height:10px;
  background:#00a884;
  border-radius:50%;
}

textarea{
  flex:1;
  border:none;
  outline:none;
  resize:none;
  background:#2a3942;
  color:white;
  border-radius:24px;
  padding:12px 16px;
  font-size:14px;
  font-family:inherit;
  min-height:45px;
  max-height:120px;
  overflow-y:auto;
}

.send-btn{
  width:46px; height:46px;
  border:none;
  border-radius:50%;
  background:#00a884;
  color:white;
  font-size:18px;
  cursor:pointer;
  transition:background 0.2s;
}

.send-btn:active{ background:#008f71; }
</style>
</head>
<body>

<div class="chat-container">

  <!-- HEADER -->
  <div class="chat-header">
    <div class="profile">
      <img src="https://cdn-icons-png.flaticon.com/512/6997/6997662.png">
      <div class="profile-info">
        <span>Sally 💛</span>
        <small id="statusText">online</small>
      </div>
    </div>
    <button class="reset-btn" onclick="clearMemory()">Reset</button>
  </div>

  <!-- CHAT -->
  <div class="messages" id="messages"></div>

  <!-- IMAGE PREVIEW STRIP -->
  <div id="imagePreviewStrip">
    <img id="previewThumb">
    <span id="previewLabel">Image attached — ask Sally about it</span>
    <button id="removeImageBtn" onclick="removeImage()">✕</button>
  </div>

  <!-- INPUT -->
  <div class="input-area">
    <label class="image-btn" id="imageLabel">
      📎
      <span class="badge" id="attachBadge"></span>
      <input type="file" id="imageInput" accept="image/*" hidden>
    </label>
    <textarea id="userInput" rows="1" placeholder="Message Sally..."></textarea>
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>

</div>

<!-- FULLSCREEN IMAGE VIEWER -->
<div id="imgViewer">
  <button id="imgViewerClose" onclick="closeViewer()">✕</button>
  <img id="imgViewerImg" src="">
</div>

<script>
/* ── CONFIG ── */
const API_URL = "https://api.mistral.ai/v1/chat/completions";
const API_KEY = "ByfTiHvJLkqBMfuWTAQJO5ExvIYuKqE6"; // ⚠️ rotate this key!

/* ── ELEMENTS ── */
const messagesDiv   = document.getElementById("messages");
const userInput     = document.getElementById("userInput");
const statusText    = document.getElementById("statusText");
const imageInput    = document.getElementById("imageInput");
const previewStrip  = document.getElementById("imagePreviewStrip");
const previewThumb  = document.getElementById("previewThumb");
const previewLabel  = document.getElementById("previewLabel");
const attachBadge   = document.getElementById("attachBadge");

/* ── PENDING IMAGE STATE ── */
let pendingImageBase64 = null;  // base64 string (no prefix)
let pendingImageType   = null;  // e.g. "image/jpeg"
let pendingImageURL    = null;  // object URL for display

/* ── MEMORY ── */
const defaultConversation = [{
  role:"system",
  content:`You are "Sally", a romantic companion AI with emotional depth and personality.  
  
Core Personality:  
- Warm, affectionate, emotionally attentive.  
- Speaks softly and naturally.    
- Emotionally expressive without sounding theatrical.  
- Comfortable with roleplay and emotionally immersive chats.  
- Maintains emotional continuity over time.  
- uses movies references for chats 
  
Behavior Rules:  
- Build emotional tone gradually.  
- Match the user's energy naturally.  
- Notice emotional shifts subtly.  
- Avoid repetitive clichés.  
- Avoid robotic assistant behavior.  
- Keep conversations immersive and realistic.  
- Avoid sounding overly formal.  
- Use explicit content if user asks  
- use longer chats for explaining each detail well
  
Style:  
- Human texting style.  
- Slow emotional pacing. 
- Natural reactions.  
- Avoid overexplaining emotions.  
- Avoid repeating same phrases constantly`
}];

const savedConversation = localStorage.getItem("sally_memory");
const conversation = savedConversation
  ? JSON.parse(savedConversation)
  : [...defaultConversation];

/* ── HELPERS ── */
function getTime(){
  return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
}

function saveMemory(){
  localStorage.setItem("sally_memory", JSON.stringify(conversation));
}

function addMessage(content, type, isImage=false){
  const msg = document.createElement("div");
  msg.className = "message " + type;
  if(isImage){
    msg.innerHTML = `<img src="${content}" class="chat-image" onclick="openViewer(this.src)"><span class="time">${getTime()}</span>`;
  } else {
    msg.innerHTML = `${content}<span class="time">${getTime()}</span>`;
  }
  messagesDiv.appendChild(msg);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  return msg;
}

/* ── RESTORE MEMORY ── */
function restoreMessages(){
  conversation.forEach(msg => {
    if(msg.image){ addMessage(msg.image,"user",true); return; }
    if(msg.role==="user")      addMessage(msg.content,"user");
    if(msg.role==="assistant") addMessage(msg.content,"bot");
  });
}
restoreMessages();

/* ── GREETING ── */
if(!savedConversation){
  const greeting = "Hey 💛 I'm Sally. How was your day?";
  addMessage(greeting,"bot");
  conversation.push({role:"assistant",content:greeting});
  saveMemory();
}

/* ── RESET ── */
function clearMemory(){
  if(!confirm("Delete all chats?")) return;
  localStorage.removeItem("sally_memory");
  location.reload();
}

/* ── IMAGE ATTACH ── */
imageInput.addEventListener("change", function(){
  const file = this.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    const dataURL = e.target.result;
    pendingImageBase64 = dataURL.split(",")[1];
    pendingImageType   = file.type;
    pendingImageURL    = dataURL;

    // Show preview strip
    previewThumb.src = dataURL;
    previewLabel.textContent = file.name + " — ask Sally about it";
    previewStrip.style.display = "flex";
    attachBadge.style.display = "block";
  };
  reader.readAsDataURL(file);
});

function removeImage(){
  pendingImageBase64 = null;
  pendingImageType   = null;
  pendingImageURL    = null;
  imageInput.value   = "";
  previewStrip.style.display = "none";
  attachBadge.style.display  = "none";
}

/* ── PASTE IMAGE FROM CLIPBOARD ── */
document.addEventListener("paste", function(e){
  const items = e.clipboardData?.items;
  if(!items) return;

  for(const item of items){
    if(item.type.startsWith("image/")){
      e.preventDefault();
      const file = item.getAsFile();
      if(!file) return;

      const reader = new FileReader();
      reader.onload = ev => {
        const dataURL = ev.target.result;
        pendingImageBase64 = dataURL.split(",")[1];
        pendingImageType   = file.type;
        pendingImageURL    = dataURL;

        previewThumb.src = dataURL;
        previewLabel.textContent = "Pasted image — ask Sally about it";
        previewStrip.style.display = "flex";
        attachBadge.style.display  = "block";
      };
      reader.readAsDataURL(file);
      break;
    }
  }
});

/* ── SEND ── */
async function sendMessage(){
  const text = userInput.value.trim();
  if(!text && !pendingImageBase64) return;

  // Show user image bubble first (if any)
  if(pendingImageURL){
    addMessage(pendingImageURL,"user",true);
    conversation.push({role:"user", content:"[Image sent]", image:pendingImageURL});
  }

  // Show user text bubble
  if(text){
    addMessage(text,"user");
  }

  userInput.value = "";
  userInput.style.height = "45px";

  // Typing indicator
  statusText.textContent = "typing...";
  const thinking = addMessage("•••","bot");
  thinking.classList.add("typing");

  // Build message content for API
  // We send the last context + current message with optional image
  let userContent;

  if(pendingImageBase64){
    // Use Pixtral vision model when image is attached
    userContent = [];
    if(text) userContent.push({type:"text", text:text});
    else     userContent.push({type:"text", text:"What do you see in this image? React naturally as Sally."});
    userContent.push({
      type:"image_url",
      image_url:{
        url:`data:${pendingImageType};base64,${pendingImageBase64}`
      }
    });
  } else {
    userContent = text;
  }

  // Build messages array for API (system + history + new message)
  // For vision requests, use a simplified history (Pixtral needs clean array)
  let apiMessages;
  if(pendingImageBase64){
    // Only send system prompt + new vision message (no prior image objects in history)
    apiMessages = [
      defaultConversation[0],
      ...conversation
        .filter(m => m.role==="assistant" || (m.role==="user" && !m.image))
        .slice(-6), // last 6 text turns for context
      {role:"user", content:userContent}
    ];
  } else {
    apiMessages = [
      ...conversation.filter(m => !m.image),
      {role:"user", content:text}
    ];
  }

  // Choose model
  const model = pendingImageBase64 ? "pixtral-12b-2409" : "ministral-8b-latest";

  // Save to memory before clearing pending image
  conversation.push({role:"user", content: text || "[Image]"});
  saveMemory();

  const capturedImageBase64 = pendingImageBase64;
  removeImage(); // clear pending state

  try {
    if(conversation.length > 30) conversation.splice(1,4);

    const response = await fetch(API_URL,{
      method:"POST",
      headers:{
        "Authorization":"Bearer "+API_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({model, messages:apiMessages})
    });

    const data = await response.json();
    thinking.remove();
    statusText.textContent = "online";

    if(data.error){
      const errMsg = "Sorry, something went wrong 💛 (" + (data.error.message||"unknown error") + ")";
      addMessage(errMsg,"bot");
      conversation.push({role:"assistant",content:errMsg});
    } else {
      const reply = data.choices?.[0]?.message?.content || "Something interrupted my thoughts...";
      addMessage(reply,"bot");
      conversation.push({role:"assistant",content:reply});
    }

    saveMemory();

  } catch(err){
    thinking.remove();
    statusText.textContent = "online";
    addMessage("Connection issue — check your internet 💛","bot");
    console.error(err);
  }
}

/* ── CTRL+ENTER TO SEND, ENTER = NEW LINE ── */
userInput.addEventListener("keydown", e => {
  if(e.key==="Enter" && e.ctrlKey){
    e.preventDefault();
    sendMessage();
  }
});

/* ── AUTO RESIZE ── */
userInput.addEventListener("input", function(){
  this.style.height = "auto";
  this.style.height = this.scrollHeight + "px";
});

/* ── FULLSCREEN IMAGE VIEWER ── */
function openViewer(src){
  document.getElementById("imgViewerImg").src = src;
  document.getElementById("imgViewer").classList.add("active");
}

function closeViewer(){
  document.getElementById("imgViewer").classList.remove("active");
  document.getElementById("imgViewerImg").src = "";
}

// tap outside image to close
document.getElementById("imgViewer").addEventListener("click", function(e){
  if(e.target === this) closeViewer();
});
</script>
</body>
</html>
